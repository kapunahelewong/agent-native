[build]
  ignore = "node ./scripts/netlify-ignore-build.mjs docs"
  command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && NITRO_PRESET=netlify pnpm --filter docs build"
  publish = "templates/docs/dist"
  functions = "templates/docs/.netlify/functions-internal"

[build.environment]
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"
